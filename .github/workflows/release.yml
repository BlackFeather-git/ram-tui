name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ram-tui
            asset_name: ram-tui-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ram-tui
            asset_name: ram-tui-darwin-aarch64

          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: ram-tui
            asset_name: ram-tui-darwin-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ram.exe
            asset_name: ram-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build -p cli --release --target ${{ matrix.target }}

      - name: Prepare Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/ram-tui target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          chmod +x target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Prepare Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/ram.exe target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/ram.exe target/${{ matrix.target }}/release/ram-tui-windows-x86_64.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
