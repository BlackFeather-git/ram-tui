name: CI Tests

on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, beta ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.10', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Run Unit Tests
      run: python -m unittest discover tests

    - name: Smoke Tests (CLI Flags, JSON Output & Non-Interactive Degradation)
      run: |
        python ram --version
        python ram --once
        python ram --json
        python ram --mini --once
        python ram --compact --once
        python ram --tiny --once

    - name: Smoke Tests (Unix Pipeline & Broken Pipe Handling)
      if: runner.os != 'Windows'
      run: |
        python ram --json | head -n 5
        python ram --json | grep -q '"memory"'
        python ram --mini --once | grep -q 'RAM'

  packaging-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate install.sh Dry-Run
      run: bash install.sh --dry-run

    - name: Validate Shell Completions Syntax
      run: |
        bash -n completions/ram.bash

    - name: Validate Scoop Manifest JSON
      run: python3 -c 'import json; json.load(open("packaging/scoop/ram.json"))'

