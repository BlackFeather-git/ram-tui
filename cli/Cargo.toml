[package]
name = "cli"
default-run = "ram"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive terminal binary for ram-tui"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core_render = { path = "../core_render" }
collector = { path = "../collector" }
ui = { path = "../ui" }

[dev-dependencies]
assert_cmd = "2"
assert-json-diff = "2"
serde_json = "1"
